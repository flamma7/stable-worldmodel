name: lewm
train_script: scripts/train/lewm.py
default:
  all:
    region: ca
    cloud: community
    data: ogb
    dataset_name: galilai-group/ogb_cube_single
    hf_repo: flamma77/lewm-base
    hf_prefix: lewm
  train:
    gpu: NVIDIA GeForce RTX 5090
    wandb_project: lewm
    wandb.enabled: true
    hf.enabled: true
    trainer.max_epochs: 10
    num_workers: 6
    batch_size: 128
  mpc:
    gpu: NVIDIA GeForce RTX 3090
    seed: 7
    num_eval: 2000
    batch_size: 50
    eval_output_dir: data
    eval_output_hf: true
    stack: 1
    solver: icem
  plan:
    gpu: NVIDIA GeForce RTX 3090
    seed: 42
    num_eval: 200
    batch_size: 50
    num_candidates: 64
    eval_output_dir: data
    eval_output_hf: true
    stack: 1
param_map:
  data: data
  dataset_name: data.dataset.name
  hf_repo: hf.repo_id
  wandb_project: wandb.config.project
  hf_prefix: hf.path_prefix
  batch_size: loader.batch_size
  lam: loss.sigreg.weight
  lr: optimizer.lr
job0:
  mode: train
  params:
    lam: 0.1
    lr: 5.0e-05
