name: lewm
train_script: scripts/train/lewm.py
default:
  all:
    region: us
    cloud: community
    data: ogb
    dataset_name: galilai-group/ogb_cube_single
    hf_repo: flamma77/lewm-base
    hf_prefix: lewm
  train:
    gpu: NVIDIA GeForce RTX 5090
    wandb_project: lewm-tdv
    wandb.enabled: true
    hf.enabled: true
    trainer.max_epochs: 10
    num_workers: 6
    batch_size: 128
  mpc:
    seed: 7
    num_eval: 2000
    batch_size: 50
    eval_output_dir: data
    eval_output_hf: true
    stack: 1
    solver: icem
    platform:
      - gpu: NVIDIA RTX A5000
        batch_size: 150
        cloud: community
        region: any
      - gpu: NVIDIA RTX A4000
        batch_size: 100
        cloud: community
      - gpu: NVIDIA RTX 4000 Ada Generation
        batch_size: 150
        cloud: secure
      - gpu: NVIDIA RTX 5000 Ada Generation
        batch_size: 250
        cloud: community
      - gpu: NVIDIA L40
        batch_size: 350
        cloud: community
        region: any
  plan:
    seed: 42
    num_eval: 200
    batch_size: 50
    num_candidates: 64
    eval_output_dir: data
    eval_output_hf: true
    stack: 1
    platform:
      - gpu: NVIDIA GeForce RTX 4080 Super
        batch_size: 100
        cloud: community
        region: any
      - gpu: NVIDIA RTX 2000 Ada Generation
        batch_size: 100
        cloud: secure
        region: any
      - gpu: NVIDIA RTX 2000 Ada Generation
        batch_size: 100
        cloud: secure
        region: any
      - gpu: NVIDIA RTX A4000
        batch_size: 100
        cloud: community
