name: visreg
train_script: scripts/train/lewm_visreg.py
default:
  all:
    region: ca
    cloud: community
    data: ogb
    dataset_name: galilai-group/ogb_cube_single
    hf_repo: flamma77/lewm-base
    hf_prefix: visreg
  train:
    gpu: NVIDIA GeForce RTX 5090
    wandb_project: lewm-visreg
    wandb.enabled: true
    hf.enabled: true
    trainer.max_epochs: 10
    num_workers: 6
    batch_size: 128
  mpc:
    gpu: NVIDIA RTX 4000 Ada Generation
    gpu_options:
      - NVIDIA GeForce RTX 4090
      - NVIDIA RTX 4000 SFF Ada Generation
      - NVIDIA RTX 4000 Ada Generation
      - NVIDIA GeForce RTX 5090
      - NVIDIA GeForce RTX 3070
      - NVIDIA RTX A4000
    seed: 7
    num_eval: 2000
    batch_size: 50
    eval_output_dir: data
    eval_output_hf: true
  plan:
    gpu: NVIDIA RTX 4000 Ada Generation
    seed: 42
    num_eval: 200
    batch_size: 50
    num_candidates: 64
    eval_output_dir: data
    eval_output_hf: true
param_map:
  data: data
  dataset_name: data.dataset.name
  hf_repo: hf.repo_id
  wandb_project: wandb.config.project
  hf_prefix: hf.path_prefix
  batch_size: loader.batch_size
  a: loss.visreg.alpha
  lr: optimizer.lr
  lsh: loss.visreg.lam_shape
  lce: loss.visreg.lam_center
  lsc: loss.visreg.lam_scale
