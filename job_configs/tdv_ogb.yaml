name: tdv
train_script: scripts/train/lewm_tdv.py
default:
  all:
    region: ca
    cloud: community
    data: ogb
    dataset_name: galilai-group/ogb_cube_single
    hf_repo: flamma77/lewm-base
    hf_prefix: tdv
  train:
    gpu: NVIDIA GeForce RTX 5090
    wandb_project: lewm-tdv
    wandb.enabled: true
    hf.enabled: true
    trainer.max_epochs: 10
    num_workers: 6
    batch_size: 128
  mpc:
    region: any
    cloud: community
    seed: 7
    num_eval: 2000
    batch_size: 150
    eval_output_dir: data
    eval_output_hf: true
    stack: 1
    solver: icem
    platform:
      - gpu: NVIDIA RTX 4000 Ada Generation
        batch_size: 150
        cloud: secure
      - gpu: NVIDIA RTX 2000 Ada Generation
        batch_size: 100
        cloud: secure
      - gpu: NVIDIA RTX A4500
        batch_size: 100
        cloud: community
      - gpu: NVIDIA GeForce RTX 3080 Ti
        batch_size: 50
        cloud: community
      - gpu: NVIDIA RTX A4000
        batch_size: 150
        cloud: community
        region: us
      - gpu: NVIDIA RTX A4000
        batch_size: 100
        cloud: secure
      - gpu: NVIDIA GeForce RTX 3090
        batch_size: 150
        cloud: community
      - gpu: NVIDIA GeForce RTX 4090
        batch_size: 200
        cloud: community
        region: canada
  plan:
    seed: 42
    num_eval: 200
    batch_size: 50
    num_candidates: 64
    eval_output_dir: data
    eval_output_hf: true
    stack: 1
    platform:
      - gpu: NVIDIA RTX 2000 Ada Generation
        batch_size: 100
        cloud: secure
        region: any
      - gpu: NVIDIA RTX A4000
        batch_size: 100
        cloud: community
      - gpu: NVIDIA GeForce RTX 4090
        batch_size: 100
        cloud: community
        region: canada
