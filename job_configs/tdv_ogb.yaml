name: tdv
train_script: scripts/train/lewm_tdv.py
default:
  all:
    region: us
    cloud: community
    data: ogb
    dataset_name: galilai-group/ogb_cube_single
    hf_repo: flamma77/lewm-base
  train:
    gpu: NVIDIA GeForce RTX 5090
    wandb.enabled: true
    hf.enabled: true
    trainer.max_epochs: 10
    num_workers: 6
    batch_size: 128
  mpc:
    gpu: NVIDIA RTX 4000 Ada Generation
    seed: 7
    num_eval: 2000
    batch_size: 100
    eval_output_dir: data
    eval_output_hf: true
  plan:
    gpu: NVIDIA RTX 4000 Ada Generation
    seed: 42
    num_eval: 50
    batch_size: 50
    eval_output_dir: data
    eval_output_hf: true
param_map:
  data: data
  dataset_name: data.dataset.name
  hf_repo: hf.repo_id
  batch_size: loader.batch_size
  a: loss.tdv.weight
  lam: loss.sigreg.weight
  lr: optimizer.lr
