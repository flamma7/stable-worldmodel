defaults:
  - _self_
  - launcher: local
  - data: ogb

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
embed_dim: 192

# Leftover from original code
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: False
log_throughput: False # logs samples/sec and other metrics

trainer:
  max_epochs: 10
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 2

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

val_loader:
  batch_size: ${loader.batch_size}
  num_workers: 4
  drop_last: False
  persistent_workers: True
  prefetch_factor: 1
  pin_memory: ${loader.pin_memory}
  shuffle: False

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3
  fused: false # must be false for gradient clipping

wm:
  history_size: 3
  num_preds: 1

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
    # Collapse diagnostics on post-projection embeddings passed to SIGReg.
    # Buffers stay on CPU and never enter the training loss / graph.
    diagnostics:
      enabled: true
      buffer_size: 8192
      # sample_every: 16
      sample_every: 2
      sample_size: 48
      # log_every: 400
      log_every: 10
      # table_log_every: 2000
      table_log_every: 20
      min_samples: 2048  # N(0,I) rank frac ~0.95; 384 would read as collapse
      eps: 1.0e-12
      background: true
      # Calibrated on N(0, I), N=8192, D=192, 256 trials, same FIFO
      # sampler (B=128, sample=48). Simulation 1–99%:
      #   variance_mean       0.9975–1.0022  (mean 0.9998)
      #   effective_rank_frac 0.9880–0.9885  (mean 0.9883; finite-N Wishart)
      #   mean_rms            0.0097–0.0123  (mean 0.0110)
      # Collapse bands stay wider than sampling noise: var/rank use the
      # 0.8–1.2 and 0.9–1.0 heuristics. mean_rms upper is 4× sim q99.
      variance_mean:
        target: 1.0
        lower_bound: 0.8
        upper_bound: 1.2
      effective_rank_frac:
        target: 1.0
        lower_bound: 0.9
        upper_bound: 1.0
      mean_rms:
        target: 0.0
        lower_bound: 0.0
        upper_bound: 0.05
