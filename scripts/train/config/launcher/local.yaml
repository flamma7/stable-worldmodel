# @package _global_
# Local launcher configuration (no SLURM)

defaults:
  - override /hydra/launcher: basic

n_gpus: 1
cpus_per_task: 8
cache_dir: null # Use stable-worldmodel default cache
wandb:
  enabled: false
  disable_system: true
  config:
    entity: flamma7-myself
    # Overridden by job_configs default.all.wandb_project
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

# Uploads weights + config.json to an existing HF model repo.
# Auth: HF_TOKEN env var, or `huggingface-cli login`.
hf:
  enabled: false
  repo_id: flamma77/lewm-base
  # Overridden by job_configs default.all.hf_prefix (controller appends output_model_name)
  path_prefix: ${output_model_name}