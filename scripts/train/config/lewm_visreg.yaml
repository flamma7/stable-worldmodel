defaults:
  - lewm
  - _self_

output_model_name: lewm_visreg
compile: true
make_it_fast: false
log_throughput: false # logs samples/sec and other metrics

# VISReg replaces SIGReg as the collapse regularizer. No TDV / motion_encoder.
loss:
  sigreg: null
  visreg:
    lam_scale: 1.0
    lam_shape: 1.0
    lam_center: 1.0
    num_projections: 4096
    # Collapse scalars on post-projection embeddings: variance_mean,
    # effective_rank_frac, mean_rms. CPU buffers, not in the training loss.
    diagnostics:
      enabled: true
      buffer_size: 8192
      sample_every: 16
      sample_size: 48
      log_every: 400
      min_samples: 2048
      eps: 1.0e-12
      background: true
