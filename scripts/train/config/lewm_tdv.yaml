defaults:
  - lewm
  - _self_

output_model_name: lewm_tdv

model:
  motion_encoder:
    _target_: stable_worldmodel.wm.lewm.module.MotionEncoder
    img_size: ${img_size}
    patch_size: ${patch_size}
    dim: ${embed_dim}
    depth: 12
    heads: 3
    dim_head: 64
    mlp_dim: 768
    dropout: 0.0
    emb_dropout: 0.0

loss:
  tdv:
    weight: 0.1
